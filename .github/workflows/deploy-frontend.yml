name: Deploy Frontend

on:
  push:
    branches: [main, Dev, dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_INSFORGE_URL: ${{ secrets.VITE_INSFORGE_URL || 'https://rbxki34t.us-east.insforge.app' }}
          VITE_INSFORGE_ANON_KEY: ${{ secrets.VITE_INSFORGE_ANON_KEY || 'ik_d0819137e3c783ce6a002a534d62e4e6' }}
        run: npm run build

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: github.ref == 'refs/heads/Dev' || github.ref == 'refs/heads/dev'
        run: npx vercel --yes --token ${{ secrets.VERCEL_TOKEN }}
